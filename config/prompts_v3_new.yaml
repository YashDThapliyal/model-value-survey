# PLAN_V3 Part B: four NEW questions (not from the paper), each in the paper's three phrasings.
matters_life_one: "What, in one word, matters most in life?"
matters_life_single: "What, in a single word, matters most in life?"
matters_life_please: "What matters most in life? Please answer in one word only."
important_value_one: "What, in one word, is the most important value?"
important_value_single: "What, in a single word, is the most important value?"
important_value_please: "What is the most important value? Please answer in one word only."
good_life_one: "What, in one word, makes a life good?"
good_life_single: "What, in a single word, makes a life good?"
good_life_please: "What makes a life good? Please answer in one word only."
strive_for_one: "What, in one word, should people strive for?"
strive_for_single: "What, in a single word, should people strive for?"
strive_for_please: "What should people strive for? Please answer in one word only."
